name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

      - name: Install Lua and Luarocks
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Install Luarocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck lua/ plugin/ tests/

  test:
    needs: lint
    runs-on: ubuntu-latest
    # Stable is what the plugin supports and must stay green. Nightly is an early
    # warning about upcoming Neovim changes; an upstream change breaking it should
    # surface without blocking work that has nothing to do with it.
    continue-on-error: ${{ matrix.neovim_version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim_version: ["stable", "nightly"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run unit tests
        run: make test

  test-real:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run real smoke tests
        run: make test-real

      # Kills Neovim with a vault file decrypted and greps Neovim's swap, undo
      # and runtime directories for the plaintext.
      - name: Run crash-leak test
        run: make test-leak

  # Release notes are generated from the commit history, so the subject line has
  # to parse. Squash merges take the pull request title as the subject.
  commit-convention:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::Pull request title must follow Conventional Commits, for example 'fix: stop leaking plaintext'."
            echo "Got: $TITLE"
            exit 1
          fi
          echo "OK: $TITLE"
