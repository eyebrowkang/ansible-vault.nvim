# Changelog generation for git-cliff. https://git-cliff.org
#
# git-cliff drafts release notes from Conventional Commits; maintainers curate them.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
[git-cliff](https://git-cliff.org) seeds a draft from commit history; maintainers
then curate and commit each release entry before its tag is created.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/eyebrowkang/ansible-vault.nvim/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {% if commit.breaking %}**BREAKING** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_preprocessors = [
  # Link pull requests. Squash merges carry the number in the subject.
  { pattern = '\((#([0-9]+))\)', replace = "([#${2}](https://github.com/eyebrowkang/ansible-vault.nvim/pull/${2}))" },
]

commit_parsers = [
  # Keep breaking changes even when the commit otherwise describes internal work.
  { message = "^[a-z]+(\\([^)]+\\))?!:", group = "<!-- 0 -->Breaking Changes" },
  { body = "(?m)^BREAKING[ -]CHANGE:", group = "<!-- 0 -->Breaking Changes" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "(?i)^docs.*changelog", skip = true },
  { message = "^(style|refactor|test|ci|build|chore)(\\(|:)", skip = true },

  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix|^revert", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { body = "(?i).*security", group = "<!-- 2 -->Bug Fixes" },
]

filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
