# Changelog generation for git-cliff. https://git-cliff.org
#
# Release notes come from the commit history, so commits have to follow
# Conventional Commits. See CONTRIBUTING.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
This file is generated by [git-cliff](https://git-cliff.org).\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/eyebrowkang/ansible-vault.nvim/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {% if commit.breaking %}**BREAKING** {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_preprocessors = [
  # Link pull requests. Squash merges carry the number in the subject.
  { pattern = '\((#([0-9]+))\)', replace = "([#${2}](https://github.com/eyebrowkang/ansible-vault.nvim/pull/${2}))" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci|^build", group = "<!-- 6 -->Build & CI" },
  # Changelog bookkeeping should not appear in the changelog.
  { message = "^chore\\(release\\)", skip = true },
  { message = "(?i)^docs.*changelog", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { message = "^style", skip = true },
  { body = ".*security", group = "<!-- 1 -->Bug Fixes" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
